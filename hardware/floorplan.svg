<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34 -27 96 56" width="1152" height="672" font-family="Helvetica, Arial, sans-serif">
  <title>Floorplan — bo Ø35 mm, anten IFA đồng ở mép trên, SHT40 ở mép dưới, CR2450 lệch tâm 2,0 mm; khớp hardware/kicad/tsensor.kicad_pcb v0.1 (1 đơn vị = 1 mm)</title>
  <defs>
    <pattern id="hatch" width="0.8" height="0.8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="0.8" height="0.8" fill="#fde8e8"/>
      <line x1="0" y1="0" x2="0" y2="0.8" stroke="#d33" stroke-width="0.18"/>
    </pattern>
    <clipPath id="boardFront"><circle cx="0" cy="0" r="17.5"/></clipPath>
    <clipPath id="boardBack"><circle cx="40" cy="0" r="17.5"/></clipPath>
  </defs>
  <rect x="-34" y="-27" width="96" height="56" fill="#ffffff"/>

  <!-- ===================== MẶT TRƯỚC ===================== -->
  <text x="0" y="-23.6" font-size="1.7" text-anchor="middle" font-weight="bold">MẶT TRƯỚC (linh kiện)</text>
  <circle cx="0" cy="0" r="17.5" fill="#eaf5ea" stroke="#222" stroke-width="0.25"/>

  <!-- Vùng cấm đồng/via/track mọi lớp: y < -10.1 -->
  <path d="M -14.29 -10.1 A 17.5 17.5 0 0 1 14.29 -10.1 Z" fill="url(#hatch)" stroke="#d33" stroke-width="0.15"/>
  <!-- Anten IFA uốn khúc theo TI AN043 (15,2 × 5,7 mm), đồng F.Cu, hướng lên mép trên -->
  <g fill="#c0392b">
    <rect x="-7.2" y="-15" width="0.9" height="5.4"/>
    <rect x="-4.9" y="-15" width="0.5" height="5.4"/>
    <rect x="-7.2" y="-15.5" width="5" height="0.5"/>
    <rect x="-2.7" y="-15" width="0.5" height="2.64"/>
    <rect x="-2.7" y="-12.86" width="3" height="0.5"/>
    <rect x="-0.2" y="-15" width="0.5" height="2.64"/>
    <rect x="-0.2" y="-15.5" width="2.7" height="0.5"/>
    <rect x="2" y="-15" width="0.5" height="2.64"/>
    <rect x="2" y="-12.86" width="3" height="0.5"/>
    <rect x="4.5" y="-15" width="0.5" height="2.64"/>
    <rect x="4.5" y="-15.5" width="2.7" height="0.5"/>
    <rect x="6.7" y="-15" width="0.5" height="3.94"/>
  </g>
  <rect x="-7.5" y="-10.1" width="3.4" height="0.8" fill="#ffffff" stroke="#d33" stroke-width="0.06" stroke-dasharray="0.3 0.2"/>
  <rect x="-7.2" y="-10.1" width="0.9" height="0.5" fill="#c0392b"/>
  <rect x="-4.9" y="-10.1" width="0.5" height="0.5" fill="#c0392b"/>
  <circle cx="-6.75" cy="-9.85" r="0.3" fill="#111"/>
  <circle cx="-4.65" cy="-9.85" r="0.22" fill="#2e86c1"/>
  <line x1="-14.29" y1="-10.1" x2="14.29" y2="-10.1" stroke="#555" stroke-width="0.1" stroke-dasharray="0.6 0.4"/>
  <text x="0" y="-18.6" font-size="1.0" text-anchor="middle" fill="#a00">Anten IFA đồng trên PCB (TI AN043) + vùng cấm đồng/via/track mọi lớp (y &lt; −10,1 mm)</text>
  <text x="-33.4" y="-17.0" font-size="0.85" fill="#a00">Anten IFA uốn khúc 15,2 × 5,7 mm</text>
  <text x="-33.4" y="-16.0" font-size="0.7" fill="#a00">mặt đất tham chiếu: In1.Cu (lớp 2),</text>
  <text x="-33.4" y="-15.1" font-size="0.7" fill="#a00">chân trái → via GND (chấm đen),</text>
  <text x="-33.4" y="-14.2" font-size="0.7" fill="#a00">chân phải = điểm feed (chấm xanh)</text>
  <line x1="-18.6" y1="-15.6" x2="-7.0" y2="-12.8" stroke="#a00" stroke-width="0.08"/>
  <text x="15.0" y="-10.4" font-size="0.6" fill="#555" text-anchor="start">mép mặt đất</text>

  <!-- Bóng pin ở mặt sau -->
  <circle cx="0" cy="2.0" r="12.25" fill="none" stroke="#777" stroke-width="0.2" stroke-dasharray="0.8 0.5"/>
  <text x="-33.4" y="12.2" font-size="0.8" fill="#555">bóng CR2450 Ø24,5 (mặt sau),</text>
  <text x="-33.4" y="13.2" font-size="0.8" fill="#555">lệch tâm 2,0 mm về 6 giờ</text>
  <line x1="-21.6" y1="12.6" x2="-10.9" y2="7.6" stroke="#777" stroke-width="0.08"/>

  <!-- RF: phối hợp + π ngay dưới mép mặt đất, MG24 xoay 180° (chân RF hướng lên anten) -->
  <rect x="-6.1" y="-9.95" width="7.3" height="2.1" fill="#d6dbdf" stroke="#5d6d7e" stroke-width="0.1"/>
  <text x="-33.4" y="-11.6" font-size="0.75" fill="#333">chuỗi phối hợp RF + π (0201/0402),</text>
  <text x="-33.4" y="-10.7" font-size="0.75" fill="#333">feed ở bên trái, sát chân anten</text>
  <line x1="-20.6" y1="-11.0" x2="-6.1" y2="-9.4" stroke="#5d6d7e" stroke-width="0.08"/>
  <rect x="-2.5" y="-6.2" width="5" height="5" fill="#2c3e50"/>
  <text x="0" y="-3.9" font-size="0.95" text-anchor="middle" fill="#fff">MG24</text>
  <text x="0" y="-2.8" font-size="0.75" text-anchor="middle" fill="#fff">QFN40</text>
  <rect x="7.2" y="4.2" width="1.6" height="3.2" fill="#d4ac0d"/>
  <rect x="10.1" y="4.2" width="1.6" height="3.2" fill="#d4ac0d"/>
  <rect x="-1.8" y="2.7" width="1.6" height="0.8" fill="#d4ac0d"/>
  <rect x="-7" y="0.1" width="0.8" height="1.6" fill="#d4ac0d"/>
  <rect x="-0.3" y="0" width="0.5" height="1" fill="#d4ac0d"/>
  <rect x="0.7" y="0" width="0.5" height="1" fill="#d4ac0d"/>
  <rect x="-1.3" y="0" width="0.5" height="1" fill="#d4ac0d"/>
  <rect x="1.9" y="-7.7" width="1" height="0.5" fill="#d4ac0d"/>
  <rect x="-2.9" y="-7.7" width="1" height="0.5" fill="#d4ac0d"/>
  <rect x="-4.15" y="-3.1" width="0.5" height="1" fill="#d4ac0d"/>
  <rect x="-0.5" y="10.25" width="1" height="0.5" fill="#d4ac0d"/>
  <rect x="5.1" y="-2.45" width="1" height="0.5" fill="#7d3c98"/>
  <rect x="5.1" y="-1.35" width="1" height="0.5" fill="#7d3c98"/>
  <rect x="-6.3" y="7.95" width="1" height="0.5" fill="#7d3c98"/>
  <rect x="10.5" y="-2.25" width="1" height="0.5" fill="#7d3c98"/>
  <rect x="-4.85" y="-0.1" width="2.5" height="2" fill="#95a5a6"/>
  <rect x="10.35" y="-0.55" width="1.3" height="2.9" fill="#6c3483"/>
  <rect x="3.8" y="-5.7" width="1.6" height="2" fill="#7f8c8d"/>
  <rect x="2" y="0" width="2" height="1.2" fill="#7f8c8d"/>
  <rect x="-6.6" y="6" width="1.6" height="0.8" fill="#e74c3c"/>
  <text x="6.0" y="-4.4" font-size="0.75" fill="#333">HFXO</text>
  <text x="4.3" y="1.95" font-size="0.75" fill="#333">LFXO</text>
  <text x="-5.2" y="-0.5" font-size="0.75" fill="#333" text-anchor="end">L DC-DC</text>
  <text x="6.4" y="-0.1" font-size="0.7" fill="#333">pull-up I²C</text>
  <text x="9.45" y="8.6" font-size="0.75" fill="#333" text-anchor="middle">2×100 µF</text>
  <text x="12.0" y="3.4" font-size="0.75" fill="#333">P-FET</text>

  <!-- Nút TS-1088 (3,9 × 3,0 mm, 2 chân SMD) + LED -->
  <rect x="-2.75" y="5.6" width="1.05" height="2.0" fill="#b7950b"/>
  <rect x="1.7" y="5.6" width="1.05" height="2.0" fill="#b7950b"/>
  <rect x="-1.95" y="5.1" width="3.9" height="3.0" rx="0.2" fill="#34495e"/>
  <circle cx="0" cy="6.6" r="0.9" fill="#5d6d7e"/>
  <text x="0" y="9.2" font-size="0.75" text-anchor="middle">Nút TS-1088</text>
  <text x="-7.0" y="6.7" font-size="0.75" text-anchor="end">LED đỏ</text>

  <!-- Lưỡi cảm biến ở hướng 6 giờ (mép dưới), SHT40 ở đầu lưỡi -->
  <g clip-path="url(#boardFront)">
    <rect x="-2" y="11.1" width="4" height="8" fill="#f6fbf6"/>
    <rect x="-2.8" y="11.1" width="0.8" height="8" rx="0.4" fill="#ffffff" stroke="#000" stroke-width="0.1"/>
    <rect x="2" y="11.1" width="0.8" height="8" rx="0.4" fill="#ffffff" stroke="#000" stroke-width="0.1"/>
    <line x1="-0.45" y1="10.8" x2="-0.45" y2="14.85" stroke="#b9770e" stroke-width="0.12"/>
    <line x1="-0.15" y1="10.8" x2="-0.15" y2="14.85" stroke="#b9770e" stroke-width="0.12"/>
    <line x1="0.15" y1="10.8" x2="0.15" y2="14.85" stroke="#b9770e" stroke-width="0.12"/>
    <line x1="0.45" y1="10.8" x2="0.45" y2="14.85" stroke="#b9770e" stroke-width="0.12"/>
    <rect x="-0.75" y="14.85" width="1.5" height="1.5" fill="#1a5276"/>
  </g>
  <line x1="0.9" y1="16" x2="6.3" y2="18.9" stroke="#1a5276" stroke-width="0.08"/>
  <text x="6.5" y="19.2" font-size="0.85" fill="#1a5276">SHT40 trên "lưỡi" (6 giờ, mép dưới)</text>
  <text x="6.5" y="20.2" font-size="0.72" fill="#1a5276">2 khe phay 0,8 mm, không đổ đồng/via mọi lớp</text>

  <!-- Pad test -->
  <circle cx="-8.4" cy="10.4" r="0.5" fill="#b7950b"/><text x="-8.4" y="11.9" font-size="0.6" text-anchor="middle" fill="#333">VBAT</text>
  <circle cx="-5.4" cy="12.6" r="0.5" fill="#b7950b"/><text x="-5.4" y="14.1" font-size="0.6" text-anchor="middle" fill="#333">GND</text>
  <circle cx="-12.6" cy="2" r="0.5" fill="#b7950b"/><text x="-11.6" y="2.25" font-size="0.6" text-anchor="start" fill="#333">TX</text>
  <circle cx="-12.6" cy="4.6" r="0.5" fill="#b7950b"/><text x="-11.6" y="4.85" font-size="0.6" text-anchor="start" fill="#333">RX</text>
  <circle cx="5.4" cy="12.6" r="0.5" fill="#b7950b"/><text x="5.4" y="14.1" font-size="0.6" text-anchor="middle" fill="#333">PTI-D</text>
  <circle cx="8.4" cy="10.4" r="0.5" fill="#b7950b"/><text x="8.4" y="11.9" font-size="0.6" text-anchor="middle" fill="#333">PTI-F</text>

  <!-- TC2030-NL ở hướng 10 giờ, ngay dưới mép mặt đất, ngoài bóng pin và thân kẹp -->
  <g transform="translate(-11.8 -8.1)">
    <circle cx="-1.27" cy="-0.635" r="0.39" fill="#b7950b"/>
    <circle cx="0" cy="-0.635" r="0.39" fill="#b7950b"/>
    <circle cx="1.27" cy="-0.635" r="0.39" fill="#b7950b"/>
    <circle cx="-1.27" cy="0.635" r="0.39" fill="#b7950b"/>
    <circle cx="0" cy="0.635" r="0.39" fill="#b7950b"/>
    <circle cx="1.27" cy="0.635" r="0.39" fill="#b7950b"/>
    <circle cx="2.54" cy="-1.016" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
    <circle cx="2.54" cy="1.016" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
    <circle cx="-2.54" cy="0" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
  </g>
  <text x="-33.4" y="-7.4" font-size="0.85">TC2030-NL (SWD)</text>
  <text x="-33.4" y="-6.4" font-size="0.7">3 lỗ định vị xuyên bo, nằm ngoài</text>
  <text x="-33.4" y="-5.5" font-size="0.7">bóng pin và thân kẹp (+)</text>
  <line x1="-15.0" y1="-7.5" x2="-21.2" y2="-7.6" stroke="#000" stroke-width="0.08"/>

  <!-- Thước -->
  <line x1="-17.5" y1="22.0" x2="17.5" y2="22.0" stroke="#000" stroke-width="0.12"/>
  <line x1="-17.5" y1="21.4" x2="-17.5" y2="22.6" stroke="#000" stroke-width="0.12"/>
  <line x1="17.5" y1="21.4" x2="17.5" y2="22.6" stroke="#000" stroke-width="0.12"/>
  <text x="0" y="23.7" font-size="1" text-anchor="middle">Ø35 mm</text>

  <text x="-33.4" y="26.6" font-size="0.8" fill="#333">Vị trí lấy từ tools/kicad_gen/design.py (PCB v0.1, chưa đi dây). Biến thể B (MGM240S): đặt module ở vị trí MG24,</text>
  <text x="-33.4" y="27.7" font-size="0.8" fill="#333">anten loop vẽ bằng đồng theo datasheet, cách mép đồng 1,5 mm, cutout lớp trong/dưới.</text>

  <!-- ===================== MẶT SAU ===================== -->
  <text x="40" y="-23.6" font-size="1.7" text-anchor="middle" font-weight="bold">MẶT SAU (nhìn từ sau, đã lật)</text>
  <circle cx="40" cy="0" r="17.5" fill="#eaf5ea" stroke="#222" stroke-width="0.25"/>
  <path d="M 25.71 -10.1 A 17.5 17.5 0 0 1 54.29 -10.1 Z" fill="url(#hatch)" stroke="#d33" stroke-width="0.15"/>
  <g clip-path="url(#boardBack)">
    <rect x="37.2" y="11.1" width="0.8" height="8" rx="0.4" fill="#ffffff" stroke="#000" stroke-width="0.1"/>
    <rect x="42" y="11.1" width="0.8" height="8" rx="0.4" fill="#ffffff" stroke="#000" stroke-width="0.1"/>
  </g>
  <circle cx="40" cy="2.0" r="12.25" fill="#d5d8dc" stroke="#555" stroke-width="0.2"/>
  <circle cx="40" cy="2.0" r="4.5" fill="#f4d03f" stroke="#9a7d0a" stroke-width="0.15"/>
  <text x="40" y="2.4" font-size="1" text-anchor="middle">pad (−) Ø9 ENIG</text>
  <rect x="25.45" y="-5.7" width="29.1" height="15.4" rx="1" fill="#f9e79f" fill-opacity="0.35" stroke="#9a7d0a" stroke-width="0.25"/>
  <rect x="25.05" y="-1.8" width="2.6" height="7.6" fill="#b7950b"/>
  <rect x="52.35" y="-1.8" width="2.6" height="7.6" fill="#b7950b"/>
  <text x="40" y="8.3" font-size="0.9" text-anchor="middle">kẹp (+) MY-2450-03 29,1×15,4 mm</text>
  <text x="40" y="9.4" font-size="0.8" text-anchor="middle">pad 2,6×7,6 mm, mép–mép 29,90 mm</text>
  <circle cx="49.26" cy="-9.12" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
  <circle cx="49.26" cy="-7.08" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
  <circle cx="54.34" cy="-8.1" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
  <!-- Chữ in mặt sau (B.SilkS), ở dải phía trên pin, ngay sau lưng anten -->
  <text x="40" y="-14.25" font-size="1.3" text-anchor="middle" fill="#2c3e50" font-weight="bold">Temperature sensor</text>
  <text x="40" y="-12.85" font-size="1.1" text-anchor="middle" fill="#2c3e50">Design by Haxeko</text>
  <text x="40" y="-11.6" font-size="1.1" text-anchor="middle" fill="#2c3e50">Made in Vietnam</text>
  <text x="40" y="-7.6" font-size="0.85" text-anchor="middle">B.Cu: GND liền khối</text>
  <text x="40" y="20.4" font-size="0.85" text-anchor="middle">Chữ in mặt sau nằm ở dải phía trên pin (sau lưng anten), không bị pin che</text>
  <text x="40" y="21.8" font-size="0.85" text-anchor="middle">Mặt sau chỉ có kẹp pin (SMD) → PCBA 2 mặt</text>
  <text x="40" y="23.2" font-size="0.85" text-anchor="middle">hoặc hàn tay kẹp sau khi lắp mặt trước</text>
</svg>
