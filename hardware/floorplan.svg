<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34 -27 96 54" width="1152" height="648" font-family="Helvetica, Arial, sans-serif">
  <title>Floorplan — bo Ø35 mm, CR2450 lệch tâm 2,0 mm, khớp hardware/kicad/tsensor.kicad_pcb v0.1 (1 đơn vị = 1 mm)</title>
  <defs>
    <pattern id="hatch" width="0.8" height="0.8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="0.8" height="0.8" fill="#fde8e8"/>
      <line x1="0" y1="0" x2="0" y2="0.8" stroke="#d33" stroke-width="0.18"/>
    </pattern>
    <clipPath id="boardFront"><circle cx="0" cy="0" r="17.5"/></clipPath>
    <clipPath id="boardBack"><circle cx="40" cy="0" r="17.5"/></clipPath>
  </defs>
  <rect x="-34" y="-27" width="96" height="54" fill="#ffffff"/>

  <!-- ===================== MẶT TRƯỚC ===================== -->
  <text x="0" y="-23.6" font-size="1.7" text-anchor="middle" font-weight="bold">MẶT TRƯỚC (linh kiện)</text>
  <circle cx="0" cy="0" r="17.5" fill="#eaf5ea" stroke="#222" stroke-width="0.25"/>

  <!-- Vùng cấm đồng anten: y < -14,4 -->
  <path d="M -9.94 -14.4 A 17.5 17.5 0 0 1 9.94 -14.4 Z" fill="url(#hatch)" stroke="#d33" stroke-width="0.15"/>
  <rect x="0.2" y="-16.65" width="3.2" height="1.6" fill="#c0392b"/>
  <text x="0" y="-18.6" font-size="1.05" text-anchor="middle" fill="#a00">Anten chip Johanson + vùng cấm đồng/via mọi lớp (y &lt; −14,4 mm)</text>

  <!-- Bóng pin ở mặt sau -->
  <circle cx="0" cy="2.0" r="12.25" fill="none" stroke="#777" stroke-width="0.2" stroke-dasharray="0.8 0.5"/>
  <text x="0" y="15.9" font-size="0.9" text-anchor="middle" fill="#555">bóng CR2450 Ø24,5 (mặt sau), lệch tâm 2,0 mm</text>

  <!-- RF + SoC -->
  <rect x="-1.9" y="-14.3" width="5.0" height="6.6" fill="#d6dbdf" stroke="#5d6d7e" stroke-width="0.1"/>
  <text x="3.6" y="-12.6" font-size="0.75" fill="#333">match + π (0201/0402)</text>
  <rect x="-2.5" y="-7.0" width="5" height="5" fill="#2c3e50"/>
  <text x="0" y="-4.7" font-size="0.95" text-anchor="middle" fill="#fff">MG24</text>
  <text x="0" y="-3.6" font-size="0.75" text-anchor="middle" fill="#fff">QFN40</text>
  <rect x="3.8" y="-6.6" width="1.6" height="2.0" fill="#7f8c8d"/>
  <text x="4.6" y="-3.9" font-size="0.75" fill="#333" text-anchor="middle">HFXO</text>
  <rect x="2.0" y="-0.8" width="2.0" height="1.2" fill="#7f8c8d"/>
  <text x="4.3" y="0.2" font-size="0.75" fill="#333">LFXO</text>
  <rect x="-4.85" y="-0.9" width="2.5" height="2.0" fill="#95a5a6"/>
  <text x="-5.3" y="-1.3" font-size="0.75" fill="#333" text-anchor="end">L DC-DC</text>
  <rect x="-7.0" y="-0.7" width="0.8" height="1.6" fill="#d4ac0d"/>
  <rect x="-1.8" y="1.9" width="1.6" height="0.8" fill="#d4ac0d"/>
  <rect x="-1.3" y="-0.9" width="0.5" height="1.0" fill="#d4ac0d"/>
  <rect x="-0.3" y="-0.9" width="0.5" height="1.0" fill="#d4ac0d"/>
  <rect x="0.7" y="-0.9" width="0.5" height="1.0" fill="#d4ac0d"/>
  <rect x="5.1" y="-3.15" width="1.0" height="0.5" fill="#7d3c98"/>
  <rect x="5.1" y="-2.05" width="1.0" height="0.5" fill="#7d3c98"/>
  <text x="6.4" y="-2.2" font-size="0.7" fill="#333">pull-up I²C</text>

  <!-- Nguồn -->
  <rect x="7.2" y="4.2" width="1.6" height="3.2" fill="#d4ac0d"/>
  <rect x="10.1" y="4.2" width="1.6" height="3.2" fill="#d4ac0d"/>
  <text x="9.4" y="8.6" font-size="0.75" fill="#333" text-anchor="middle">2×100 µF</text>
  <rect x="10.35" y="-0.55" width="1.3" height="2.9" fill="#6c3483"/>
  <text x="12.0" y="1.3" font-size="0.75" fill="#333">P-FET</text>

  <!-- Lưỡi cảm biến ở hướng 2 giờ (−35°) -->
  <g clip-path="url(#boardFront)">
    <g transform="translate(11.88 -8.32) rotate(55)">
      <rect x="-2.8" y="-4.5" width="0.8" height="7.5" fill="#ffffff" stroke="#000" stroke-width="0.1"/>
      <rect x="2.0" y="-4.5" width="0.8" height="7.5" fill="#ffffff" stroke="#000" stroke-width="0.1"/>
      <rect x="-2.0" y="-4.5" width="4.0" height="7.5" fill="#f6fbf6"/>
      <rect x="-0.75" y="-1.85" width="1.5" height="1.5" fill="#1a5276"/>
      <line x1="-0.4" y1="-0.35" x2="-0.4" y2="3.6" stroke="#b9770e" stroke-width="0.12"/>
      <line x1="0.4" y1="-0.35" x2="0.4" y2="3.6" stroke="#b9770e" stroke-width="0.12"/>
      <rect x="-0.5" y="3.75" width="1.0" height="0.5" fill="#d4ac0d"/>
    </g>
  </g>
  <line x1="14.2" y1="-10.6" x2="19.0" y2="-13.4" stroke="#1a5276" stroke-width="0.1"/>
  <text x="19.4" y="-15.6" font-size="0.85" fill="#1a5276">SHT40 trên "lưỡi"</text>
  <text x="19.4" y="-14.5" font-size="0.72" fill="#1a5276">2 khe phay 0,8 mm từ mép bo,</text>
  <text x="19.4" y="-13.5" font-size="0.72" fill="#1a5276">không đổ đồng/via mọi lớp</text>

  <!-- Nút + LED -->
  <rect x="-2.1" y="4.2" width="4.2" height="3.2" rx="0.3" fill="#34495e"/>
  <text x="0" y="8.6" font-size="0.85" text-anchor="middle">Nút PTS815</text>
  <rect x="-6.6" y="5.4" width="1.6" height="0.8" fill="#e74c3c"/>
  <text x="-7.0" y="6.1" font-size="0.85" text-anchor="end">LED đỏ</text>

  <!-- Pad test -->
  <circle cx="-8.4" cy="10.0" r="0.5" fill="#b7950b"/>
  <circle cx="-5.8" cy="11.6" r="0.5" fill="#b7950b"/>
  <circle cx="-12.4" cy="2.0" r="0.5" fill="#b7950b"/>
  <circle cx="-12.4" cy="4.6" r="0.5" fill="#b7950b"/>
  <circle cx="5.8" cy="11.6" r="0.5" fill="#b7950b"/>
  <circle cx="8.4" cy="10.0" r="0.5" fill="#b7950b"/>
  <text x="0" y="12.9" font-size="0.75" text-anchor="middle" fill="#333">pad test: VBAT, GND, TX, RX, PTI</text>

  <!-- TC2030 ở hướng 11 giờ, ngoài bóng pin và kẹp -->
  <g transform="translate(-7.92 -11.3) rotate(-35)">
    <circle cx="-1.27" cy="-0.635" r="0.39" fill="#b7950b"/>
    <circle cx="0" cy="-0.635" r="0.39" fill="#b7950b"/>
    <circle cx="1.27" cy="-0.635" r="0.39" fill="#b7950b"/>
    <circle cx="-1.27" cy="0.635" r="0.39" fill="#b7950b"/>
    <circle cx="0" cy="0.635" r="0.39" fill="#b7950b"/>
    <circle cx="1.27" cy="0.635" r="0.39" fill="#b7950b"/>
    <circle cx="2.54" cy="-1.016" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
    <circle cx="2.54" cy="1.016" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
    <circle cx="-2.54" cy="0" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
  </g>
  <text x="-33.4" y="-12.0" font-size="0.85">TC2030-NL (SWD)</text>
  <text x="-33.4" y="-11.0" font-size="0.7">3 lỗ định vị xuyên bo, nằm ngoài</text>
  <text x="-33.4" y="-10.1" font-size="0.7">bóng pin và thân kẹp (+)</text>
  <line x1="-10.6" y1="-12.2" x2="-21.0" y2="-11.4" stroke="#000" stroke-width="0.08"/>

  <!-- Thước -->
  <line x1="-17.5" y1="20.2" x2="17.5" y2="20.2" stroke="#000" stroke-width="0.12"/>
  <line x1="-17.5" y1="19.6" x2="-17.5" y2="20.8" stroke="#000" stroke-width="0.12"/>
  <line x1="17.5" y1="19.6" x2="17.5" y2="20.8" stroke="#000" stroke-width="0.12"/>
  <text x="0" y="21.9" font-size="1" text-anchor="middle">Ø35 mm</text>

  <text x="-33.4" y="24.8" font-size="0.8" fill="#333">Vị trí lấy từ tools/kicad_gen/design.py (PCB v0.1, chưa đi dây). Biến thể B (MGM240S): đặt module ở vị trí MG24,</text>
  <text x="-33.4" y="25.9" font-size="0.8" fill="#333">anten loop vẽ bằng đồng theo datasheet, cách mép đồng 1,5 mm, cutout lớp trong/dưới.</text>

  <!-- ===================== MẶT SAU ===================== -->
  <text x="40" y="-23.6" font-size="1.7" text-anchor="middle" font-weight="bold">MẶT SAU (nhìn từ sau, đã lật)</text>
  <circle cx="40" cy="0" r="17.5" fill="#eaf5ea" stroke="#222" stroke-width="0.25"/>
  <path d="M 30.06 -14.4 A 17.5 17.5 0 0 1 49.94 -14.4 Z" fill="url(#hatch)" stroke="#d33" stroke-width="0.15"/>
  <g clip-path="url(#boardBack)">
    <g transform="translate(28.12 -8.32) rotate(-55)">
      <rect x="-2.8" y="-4.5" width="0.8" height="7.5" fill="#ffffff" stroke="#000" stroke-width="0.1"/>
      <rect x="2.0" y="-4.5" width="0.8" height="7.5" fill="#ffffff" stroke="#000" stroke-width="0.1"/>
    </g>
  </g>
  <circle cx="40" cy="2.0" r="12.25" fill="#d5d8dc" stroke="#555" stroke-width="0.2"/>
  <circle cx="40" cy="2.0" r="4.5" fill="#f4d03f" stroke="#9a7d0a" stroke-width="0.15"/>
  <text x="40" y="2.4" font-size="1" text-anchor="middle">pad (−) Ø9 ENIG</text>
  <rect x="25.45" y="-5.7" width="29.1" height="15.4" rx="1" fill="#f9e79f" fill-opacity="0.35" stroke="#9a7d0a" stroke-width="0.25"/>
  <rect x="25.05" y="-1.8" width="2.6" height="7.6" fill="#b7950b"/>
  <rect x="52.35" y="-1.8" width="2.6" height="7.6" fill="#b7950b"/>
  <text x="40" y="8.3" font-size="0.9" text-anchor="middle">kẹp (+) MY-2450-03 29,1×15,4 mm</text>
  <text x="40" y="9.4" font-size="0.8" text-anchor="middle">pad 2,6×7,6 mm, mép–mép 29,90 mm</text>
  <circle cx="45.26" cy="-11.93" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
  <circle cx="46.42" cy="-13.59" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
  <circle cx="50.0" cy="-9.84" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
  <text x="40" y="-10.6" font-size="0.85" text-anchor="middle" fill="#a00">không đồng dưới anten (mọi lớp)</text>
  <text x="40" y="-7.2" font-size="0.85" text-anchor="middle">B.Cu: GND liền khối</text>
  <text x="40" y="21.9" font-size="0.85" text-anchor="middle">Mặt sau chỉ có kẹp pin (SMD) → PCBA 2 mặt</text>
  <text x="40" y="23.3" font-size="0.85" text-anchor="middle">hoặc hàn tay kẹp sau khi lắp mặt trước</text>
</svg>
