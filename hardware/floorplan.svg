<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34 -27 96 54" width="1152" height="648" font-family="Helvetica, Arial, sans-serif">
  <title>Floorplan đề xuất — bo Ø35 mm, CR2450 lệch tâm 3,5 mm (tỉ lệ 1 đơn vị = 1 mm)</title>
  <defs>
    <pattern id="hatch" width="0.8" height="0.8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="0.8" height="0.8" fill="#fde8e8"/>
      <line x1="0" y1="0" x2="0" y2="0.8" stroke="#d33" stroke-width="0.18"/>
    </pattern>
    <clipPath id="boardFront"><circle cx="0" cy="0" r="17.5"/></clipPath>
    <clipPath id="boardBack"><circle cx="40" cy="0" r="17.5"/></clipPath>
  </defs>
  <rect x="-34" y="-27" width="96" height="54" fill="#ffffff"/>

  <!-- ===================== MẶT TRƯỚC ===================== -->
  <text x="0" y="-23.6" font-size="1.7" text-anchor="middle" font-weight="bold">MẶT TRƯỚC (linh kiện)</text>
  <circle cx="0" cy="0" r="17.5" fill="#eaf5ea" stroke="#222" stroke-width="0.25"/>

  <!-- Vùng cấm đồng anten: đoạn tròn y < -14 -->
  <path d="M -10.5 -14 A 17.5 17.5 0 0 1 10.5 -14 Z" fill="url(#hatch)" stroke="#d33" stroke-width="0.15"/>
  <rect x="-1.6" y="-16.4" width="3.2" height="1.6" fill="#c0392b"/>
  <text x="0" y="-18.6" font-size="1.05" text-anchor="middle" fill="#a00">Anten chip 2,4 GHz + vùng cấm đồng mọi lớp (~21×3,5 mm)</text>

  <!-- Bóng pin ở mặt sau -->
  <circle cx="0" cy="3.5" r="12.25" fill="none" stroke="#777" stroke-width="0.2" stroke-dasharray="0.8 0.5"/>
  <text x="0" y="14.2" font-size="0.95" text-anchor="middle" fill="#555">bóng CR2450 Ø24,5 (mặt sau), lệch tâm 3,5 mm</text>
  <text x="0" y="15.4" font-size="0.95" text-anchor="middle" fill="#555">→ dải không có pin rộng 8,75 mm phía anten</text>

  <!-- Mạng phối hợp + SoC -->
  <rect x="-1.9" y="-13.9" width="3.8" height="0.75" fill="#5d6d7e"/>
  <text x="2.3" y="-13.25" font-size="0.8" fill="#333">match + π tuning</text>
  <rect x="-2.5" y="-13" width="5" height="5" fill="#2c3e50"/>
  <text x="0" y="-10.2" font-size="0.95" text-anchor="middle" fill="#fff">MG24</text>
  <text x="0" y="-9.1" font-size="0.75" text-anchor="middle" fill="#fff">QFN40</text>
  <rect x="3.1" y="-12.3" width="2.0" height="1.6" fill="#7f8c8d"/>
  <text x="5.4" y="-11.0" font-size="0.75" fill="#333">HFXO 39 MHz</text>
  <rect x="-5.2" y="-12.1" width="2.0" height="1.2" fill="#7f8c8d"/>
  <text x="-5.4" y="-12.6" font-size="0.75" fill="#333" text-anchor="end">LFXO</text>
  <rect x="-1.0" y="-7.6" width="2.0" height="1.6" fill="#95a5a6"/>
  <text x="1.3" y="-6.4" font-size="0.75" fill="#333">L DCDC</text>

  <!-- Nguồn -->
  <rect x="5.6" y="-2.0" width="3.2" height="1.6" fill="#d4ac0d"/>
  <rect x="5.6" y="0.0" width="3.2" height="1.6" fill="#d4ac0d"/>
  <text x="9.2" y="0.4" font-size="0.75" fill="#333">2×100 µF (1206)</text>
  <rect x="6.0" y="2.2" width="2.9" height="1.5" fill="#6c3483"/>
  <text x="9.2" y="3.3" font-size="0.75" fill="#333">P-MOSFET</text>

  <!-- Lưỡi cảm biến (xoay theo hướng bán kính 215°) -->
  <g clip-path="url(#boardFront)">
    <g transform="translate(-11.88 -8.32) rotate(-55)">
      <rect x="-2.8" y="-4.5" width="0.8" height="6.5" fill="#ffffff" stroke="#000" stroke-width="0.1"/>
      <rect x="2.0" y="-4.5" width="0.8" height="6.5" fill="#ffffff" stroke="#000" stroke-width="0.1"/>
      <rect x="-2.0" y="-4.5" width="4.0" height="7.5" fill="#f6fbf6"/>
      <rect x="-0.75" y="-2.4" width="1.5" height="1.5" fill="#1a5276"/>
      <line x1="-0.4" y1="-0.9" x2="-0.4" y2="3" stroke="#b9770e" stroke-width="0.12"/>
      <line x1="0.4" y1="-0.9" x2="0.4" y2="3" stroke="#b9770e" stroke-width="0.12"/>
    </g>
  </g>
  <line x1="-14.6" y1="-10.2" x2="-21.0" y2="-12.6" stroke="#1a5276" stroke-width="0.1"/>
  <text x="-33.4" y="-14.6" font-size="0.85" fill="#1a5276">SHT40 trên "lưỡi"</text>
  <text x="-33.4" y="-13.5" font-size="0.72" fill="#1a5276">2 khe phay 0,8 mm từ mép bo,</text>
  <text x="-33.4" y="-12.5" font-size="0.72" fill="#1a5276">không đổ đồng mọi lớp</text>

  <!-- Nút + LED -->
  <rect x="-1.95" y="2.55" width="3.9" height="2.9" rx="0.3" fill="#34495e"/>
  <text x="0" y="7.0" font-size="0.85" text-anchor="middle">Nút (giữa bo)</text>
  <rect x="-5.7" y="3.6" width="1.6" height="0.8" fill="#e74c3c"/>
  <text x="-6.1" y="4.3" font-size="0.85" text-anchor="end">LED đỏ/hổ phách</text>

  <!-- TC2030 ngoài bóng pin -->
  <g transform="translate(11.63 -8.14) rotate(-35)">
    <circle cx="-1.27" cy="-0.635" r="0.39" fill="#b7950b"/>
    <circle cx="0" cy="-0.635" r="0.39" fill="#b7950b"/>
    <circle cx="1.27" cy="-0.635" r="0.39" fill="#b7950b"/>
    <circle cx="-1.27" cy="0.635" r="0.39" fill="#b7950b"/>
    <circle cx="0" cy="0.635" r="0.39" fill="#b7950b"/>
    <circle cx="1.27" cy="0.635" r="0.39" fill="#b7950b"/>
    <circle cx="-2.54" cy="-1.016" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
    <circle cx="-2.54" cy="1.016" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
    <circle cx="2.54" cy="0" r="0.5" fill="#fff" stroke="#000" stroke-width="0.08"/>
  </g>
  <text x="19.0" y="-12.0" font-size="0.85" text-anchor="start">TC2030-NL</text>
  <text x="19.0" y="-11.0" font-size="0.7" text-anchor="start">lỗ định vị nằm</text>
  <text x="19.0" y="-10.1" font-size="0.7" text-anchor="start">ngoài bóng pin</text>
  <line x1="13.6" y1="-9.6" x2="18.8" y2="-11.3" stroke="#000" stroke-width="0.08"/>

  <!-- Thước -->
  <line x1="-17.5" y1="20.2" x2="17.5" y2="20.2" stroke="#000" stroke-width="0.12"/>
  <line x1="-17.5" y1="19.6" x2="-17.5" y2="20.8" stroke="#000" stroke-width="0.12"/>
  <line x1="17.5" y1="19.6" x2="17.5" y2="20.8" stroke="#000" stroke-width="0.12"/>
  <text x="0" y="21.9" font-size="1" text-anchor="middle">Ø35 mm</text>

  <text x="-33.4" y="24.8" font-size="0.8" fill="#333">Biến thể B (MGM240S 7×7): đặt module ở vị trí MG24, anten loop vẽ bằng đồng theo datasheet,</text>
  <text x="-33.4" y="25.9" font-size="0.8" fill="#333">cách mép đồng 1,5 mm, cutout lớp trong/dưới. Sơ đồ mang tính khái niệm, kích thước kẹp pin theo MY-2450-03.</text>
  <!-- ===================== MẶT SAU ===================== -->
  <text x="40" y="-23.6" font-size="1.7" text-anchor="middle" font-weight="bold">MẶT SAU (nhìn từ sau, đã lật)</text>
  <circle cx="40" cy="0" r="17.5" fill="#eaf5ea" stroke="#222" stroke-width="0.25"/>
  <path d="M 29.5 -14 A 17.5 17.5 0 0 1 50.5 -14 Z" fill="url(#hatch)" stroke="#d33" stroke-width="0.15"/>
  <circle cx="40" cy="3.5" r="12.25" fill="#d5d8dc" stroke="#555" stroke-width="0.2"/>
  <circle cx="40" cy="3.5" r="4.2" fill="#f4d03f" stroke="#9a7d0a" stroke-width="0.15"/>
  <text x="40" y="3.9" font-size="1" text-anchor="middle">pad (−) ENIG</text>
  <rect x="25.45" y="-4.2" width="29.1" height="15.4" rx="1" fill="#f9e79f" fill-opacity="0.35" stroke="#9a7d0a" stroke-width="0.25"/>
  <rect x="25.05" y="-0.3" width="2.6" height="7.6" fill="#b7950b"/>
  <rect x="52.35" y="-0.3" width="2.6" height="7.6" fill="#b7950b"/>
  <text x="40" y="9.8" font-size="0.9" text-anchor="middle">kẹp (+) MY-2450-03 29,1×15,4 mm</text>
  <text x="40" y="10.9" font-size="0.8" text-anchor="middle">pad hàn hai đầu, tổng 29,9 mm (kiểm lại DS)</text>
  <text x="40" y="-10.6" font-size="0.85" text-anchor="middle" fill="#a00">không đồng dưới anten (mọi lớp)</text>
  <text x="40" y="-6.5" font-size="0.85" text-anchor="middle">L4: GND liền khối dưới vùng pin</text>
  <text x="40" y="21.9" font-size="0.85" text-anchor="middle">Chỉ đế pin ở mặt sau → PCBA 1 mặt + hàn đế pin</text>
  <text x="40" y="23.3" font-size="0.85" text-anchor="middle">(hoặc PCBA 2 mặt nếu holder SMD)</text>
</svg>
